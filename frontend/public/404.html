<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hotel_booking/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HPC-Hotel</title>
    <script type="text/javascript">
        // Single Page Apps redirect for GitHub Pages
        // Redirect subroutes back to the main index.html with Hash/Path support
        var segmentCount = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
    <div id="root"></div>
</body>

</html>
